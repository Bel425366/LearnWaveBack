spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect

# Pool de conexoes (HikariCP) - resiliencia contra conexoes derrubadas pelo Somee
# O Somee (plano gratuito) fecha conexoes ociosas rapidamente, por isso:
# - pool pequeno e conexoes de vida curta (30s), recicladas antes do Somee derrubar
# - valida a conexao antes de usar (SELECT 1)
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.idle-timeout=20000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=25000
spring.datasource.hikari.validation-timeout=5000

# Configuracao de email via Resend (API HTTP - porta 443)
# O Render bloqueia SMTP no plano gratuito, por isso usamos API HTTP
resend.api.key=${RESEND_API_KEY:}
resend.from.email=${RESEND_FROM_EMAIL:onboarding@resend.dev}

# URL do front-end para montar o link de redefinicao de senha
app.frontend.url=${FRONTEND_URL:https://learn-wave-1.vercel.app}
